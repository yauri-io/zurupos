# Production release of the cashier APK (D-055, docs/DEPLOY.md "Automatic release").
# Runs only for a tag like `cashier-v0.2.0` on a commit that's on main, and waits for
# approval on the `production` environment, which holds the signing key.
# Publishes to the public R2 bucket behind dl.zurupos.com:
#   cashier/zurupos-cashier-<version>.apk   kept, never overwritten (rollback)
#   cashier/zurupos-cashier.apk             always the latest
#   cashier/latest.json                     version, size, SHA-256, date
name: Cashier release

on:
  push:
    tags: ['cashier-v*']

permissions:
  contents: write # create the GitHub Release

# Never two releases at once: they'd race on the "latest" files.
concurrency:
  group: cashier-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/cashier
    env:
      API_URL: https://api.zurupos.com
      DOWNLOAD_BASE: https://dl.zurupos.com/cashier
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      # R2 rejects the newer default checksum headers of the AWS CLI.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the "is it on main" check

      - name: Version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#cashier-v}"
          # Plain MAJOR.MINOR.PATCH, minor and patch below 100, so the version code
          # (MAJOR*10000 + MINOR*100 + PATCH) always grows with the version.
          echo "$version" | grep -Eq '^(0|[1-9][0-9]{0,2})\.([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$' \
            || { echo "::error::Tag must look like cashier-v1.2.3 (minor and patch 0-99), got $tag"; exit 1; }
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          [ "$code" -gt 1 ] || { echo "::error::Version code $code must be above 1 (the first sideloaded build)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $version, code $code"

      - name: Tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME isn't on main; production releases come from main only"; exit 1; }

      - name: Version isn't published yet
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          key="cashier/zurupos-cashier-${{ steps.version.outputs.version }}.apk"
          if aws s3api head-object --endpoint-url "$R2_ENDPOINT" \
              --bucket "${{ vars.R2_DOWNLOADS_BUCKET }}" --key "$key" >/dev/null 2>&1; then
            echo "::error::$key already exists; bump the version instead of re-tagging"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build the release APK
        env:
          SENTRY_DSN: ${{ secrets.CASHIER_SENTRY_DSN }}
        run: |
          tool/build_release.sh "$API_URL" \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Remove the signing key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      # Catches a wrong keystore in the secrets: tablets would refuse the update.
      - name: Signed with the release certificate
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$apksigner" verify "$apk"
          actual=$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-F' 'a-f')
          expected=$(printf '%s' "${{ vars.ANDROID_SIGNING_CERT_SHA256 }}" | tr -d ': ' | tr 'A-F' 'a-f')
          [ -n "$expected" ] || { echo "::error::Set the ANDROID_SIGNING_CERT_SHA256 variable"; exit 1; }
          [ "$actual" = "$expected" ] \
            || { echo "::error::APK is signed with $actual, expected $expected"; exit 1; }

      - name: Name the APK and write latest.json
        id: files
        run: |
          version=${{ steps.version.outputs.version }}
          name="zurupos-cashier-$version.apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/$name"
          cd "$RUNNER_TEMP/out"
          sha=$(sha256sum "$name" | cut -d' ' -f1)
          size=$(stat -c %s "$name")
          sha256sum "$name" > "$name.sha256"
          jq -n --arg v "$version" --argjson c ${{ steps.version.outputs.code }} \
            --arg url "$DOWNLOAD_BASE/$name" --arg sha "$sha" --argjson size "$size" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg commit "$GITHUB_SHA" \
            '{version: $v, version_code: $c, url: $url, sha256: $sha, size: $size, released_at: $date, commit: $commit}' \
            > latest.json
          cat latest.json
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Versioned file first, "latest" pointers last, so latest never names a missing file.
      - name: Upload to R2
        working-directory: ${{ runner.temp }}/out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ vars.R2_DOWNLOADS_BUCKET }}
          NAME: ${{ steps.files.outputs.name }}
        run: |
          apk_type=application/vnd.android.package-archive
          put() { aws s3 cp --endpoint-url "$R2_ENDPOINT" --no-progress "$@"; }
          put "$NAME" "s3://$BUCKET/cashier/$NAME" --content-type "$apk_type" \
            --cache-control "public, max-age=31536000, immutable"
          put "$NAME.sha256" "s3://$BUCKET/cashier/$NAME.sha256" --content-type text/plain \
            --cache-control "public, max-age=31536000, immutable"
          put "$NAME" "s3://$BUCKET/cashier/zurupos-cashier.apk" --content-type "$apk_type" \
            --cache-control "no-cache" --content-disposition "attachment; filename=\"$NAME\""
          put latest.json "s3://$BUCKET/cashier/latest.json" --content-type application/json \
            --cache-control "no-cache"

      - name: GitHub Release
        working-directory: ${{ runner.temp }}/out
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.files.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$NAME" "$NAME.sha256" latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cashier ${{ steps.version.outputs.version }}" \
            --notes "Download: $DOWNLOAD_BASE/$NAME
          SHA-256: \`${{ steps.files.outputs.sha }}\`"

      - name: Summary
        run: |
          {
            echo "### Cashier ${{ steps.version.outputs.version }} (code ${{ steps.version.outputs.code }})"
            echo "- Latest: $DOWNLOAD_BASE/zurupos-cashier.apk"
            echo "- This version: $DOWNLOAD_BASE/${{ steps.files.outputs.name }}"
            echo "- SHA-256: \`${{ steps.files.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
